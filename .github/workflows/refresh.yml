name: refresh

# Weekly, zero Claude tokens: rebuild the Open Source section from GitHub (merged + in-review upstream PRs),
# commit only if something changed, then redeploy (a push made with GITHUB_TOKEN does not start deploy.yml).
on:
  schedule:
    - cron: "17 3 * * 1,4"   # Monday and Thursday, 08:47 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild open-source cards
        run: python scripts/refresh_oss.py index.html
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit and redeploy if changed
        run: |
          git diff --quiet && { echo "no change"; exit 0; }
          git config user.name "Sayak Satpathi"
          git config user.email "sayaksatpathi@users.noreply.github.com"
          git commit -qam "Refresh open-source contributions"
          git push -q
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then npm install -g -s netlify-cli && netlify deploy --dir=. --site="$NETLIFY_SITE_ID" --prod; fi
        env:
          GH_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
